[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-retail-checkout"
version = "1.0.0"
description = "Local YOLOv8 and ByteTrack retail checkout simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "uvicorn==0.52.1",
]

[project.scripts]
smart-retail = "smart_retail.app:main"
smart-retail-api = "smart_retail.api.service:main"

[project.optional-dependencies]
vision = [
    "numpy==2.4.6",
    "opencv-python==4.13.0.92",
    "ultralytics==8.4.126",
    "lap==0.5.13",
    "torch==2.13.0",
    "PyYAML==6.0.3",
]
dev = [
    "coverage[toml]==7.15.4",
    "httpx2==2.12.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.coverage.run]
branch = true
source = ["smart_retail"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == [\"']__main__[\"']:",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smart_retail = ["configs/*.json", "configs/*.yaml"]
