name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install base package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .

      - name: Verify headless package boundary
        run: |
          python -m pip check
          python - <<'PY'
          import importlib.metadata as metadata
          import importlib.util

          import smart_retail.api.service

          assert importlib.util.find_spec("cv2") is None
          assert importlib.util.find_spec("ultralytics") is None
          distribution = metadata.distribution("smart-retail-checkout")
          api_entrypoint = next(
              entry
              for entry in distribution.entry_points
              if entry.group == "console_scripts" and entry.name == "smart-retail-api"
          )
          assert callable(api_entrypoint.load())
          PY

      - name: Run headless service integration tests
        run: |
          python -m pip install --editable ".[dev]"
          python -m pytest tests/integration/test_headless_service.py -q

  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OPENCV_LOG_LEVEL: ERROR
      PYTHONUNBUFFERED: "1"
      SMART_RETAIL_MODEL_PATH: /tmp/ci-model-must-not-load.pt
      YOLO_CONFIG_DIR: /tmp/ultralytics
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[vision,dev]"

      - name: Lint
        run: python -m ruff check app.py src tests training

      - name: Check formatting
        run: python -m ruff format --check app.py src tests training

      - name: Run unit and deterministic contract tests
        run: |
          python -m pytest tests/unit tests/contracts -q \
            --cov=smart_retail \
            --cov-branch \
            --cov-fail-under=0 \
            --cov-report=

      - name: Run integration tests
        run: |
          python -m pytest tests/integration -q \
            --cov=smart_retail \
            --cov-branch \
            --cov-append \
            --cov-fail-under=0 \
            --cov-report=

      - name: Generate coverage report
        run: python -m coverage xml -o coverage.xml

      - name: Enforce coverage threshold
        run: python -m coverage report --show-missing --fail-under=85

      - name: Upload coverage XML
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
